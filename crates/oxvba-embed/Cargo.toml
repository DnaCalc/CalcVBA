[package]
name = "oxvba-embed"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Host-neutral procedure metadata and generation-checked typed calls"

[features]
default = ["jit"]
jit = ["dep:oxvba-jit"]

[dependencies]
calcvba-host-api.workspace = true
oxvba-com.workspace = true
oxvba-bind.workspace = true
oxvba-bundle.workspace = true
oxvba-hal.workspace = true
oxvba-oxir.workspace = true
oxvba-runtime.workspace = true
oxvba-symbol.workspace = true
oxvba-vm3.workspace = true
oxvba-jit = { workspace = true, optional = true }
thiserror.workspace = true
self_cell = "1.2"
oxvba-rt-abi.workspace = true
serde_json.workspace = true

[dev-dependencies]
oxvba-runtime = { workspace = true, features = ["live-counters"] }
oxvba-com = { workspace = true, features = ["fixture-typelibs"] }

[lints]
workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }
