[package]
name = "calcvba-spreadsheet-compat"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Bounded, value-oriented VBA function embedding for formula hosts"

[features]
default = ["jit"]
jit = ["dep:calcvba-jit", "calcvba-host/jit"]

[dependencies]
calcvba-host = { path = "../../crates/calcvba-host", default-features = false }
calcvba-bundle.workspace = true
calcvba-hal.workspace = true
calcvba-oxir.workspace = true
calcvba-runtime.workspace = true
calcvba-symbol.workspace = true
calcvba-jit = { workspace = true, optional = true }
thiserror.workspace = true
scoped-tls-hkt = "0.1.5"
calcvba-com.workspace = true
calcvba-eval.workspace = true

[dev-dependencies]
calcvba-runtime = { workspace = true, features = ["live-counters"] }

[lints]
workspace = true

[[example]]
name = "browser_probe"
crate-type = ["cdylib"]
