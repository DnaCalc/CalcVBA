[package]
name = "calcvba-native-template"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Developer-built runtime DLL for CalcVBA native PE exports; no compiler or VM."

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "calcvba-native-exe-template"
path = "src/exe_main.rs"

[dependencies]
calcvba-host-api.workspace = true
serde_json.workspace = true
calcvba-bundle = { path = "../calcvba-bundle" }
calcvba-runtime.workspace = true
calcvba-rt-abi.workspace = true
calcvba-oxir.workspace = true
calcvba-lib.workspace = true
calcvba-eval.workspace = true
calcvba-com.workspace = true
calcvba-hal.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_SystemServices"] }

[lints]
workspace = true
