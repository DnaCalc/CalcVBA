[package]
name = "calcvba-differential"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Differential oracle harness: runs a program under two executors and compares values, errors and ownership."

[dependencies]
calcvba-engine.workspace = true
calcvba-jit.workspace = true
calcvba-oxir.workspace = true
calcvba-runtime = { workspace = true, features = ["live-counters"] }
calcvba-symbol.workspace = true
calcvba-vm3.workspace = true
serde_json.workspace = true

[dev-dependencies]
criterion = "0.5"
calcvba-bind.workspace = true
calcvba-bundle.workspace = true
calcvba-com = { workspace = true, features = ["fixture-typelibs"] }
calcvba-hal.workspace = true
calcvba-project.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
] }

[[bench]]
name = "jit_m4_baseline"
harness = false

[lints]
workspace = true
