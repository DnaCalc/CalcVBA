[workspace]
members = [
    "crates/calcvba-host-api",
    "crates/calcvba-office",
    "crates/calcvba-diagnostics",
    "crates/calcvba-hal",
    "crates/calcvba-syntax",
    "crates/calcvba-runtime",
    "crates/calcvba-jit",
    "crates/calcvba-pe",
    "crates/calcvba-aot",
    "crates/calcvba-native-template",
    "crates/calcvba-com",
    "crates/calcvba-comhost",
    "crates/calcvba-engine",
    "crates/calcvba-build",
    "crates/calcvba-cli",
    "crates/calcvba-project",
    "crates/calcvba-bundle",
    "crates/calcvba-lib",
    "crates/calcvba-symbol",
    "crates/calcvba-bind",
    "crates/calcvba-oxir",
    "crates/calcvba-rt-abi",
    "crates/calcvba-eval",
    "crates/calcvba-vm3",
    "crates/calcvba-differential",
    "crates/calcvba-host",
    "adapters/spreadsheet-compat",
]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT"
authors = ["DNA Kode"]
repository = "https://github.com/DnaCalc/CalcVBA"

# CI runs `cargo clippy --workspace --all-targets -- -D warnings`, so every
# warn-level lint here is build-blocking. Ratchet lints (documented below)
# start at "allow" and are flipped to enforcing as review waves close.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
# Wave-1 exit ratchet (flipped 2026-06-10): every unsafe block carries a
# `// SAFETY:` comment stating the invariant that makes it sound; sites where
# the invariant could not be fully established are marked
# `SAFETY: ASSUMPTION —` for the next review pass.
undocumented_unsafe_blocks = "deny"
# Ratchet: flipped to "warn" at review-campaign end, after production
# unwrap sites are classified (kept invariants become expect/INVARIANT).
unwrap_used = "allow"

[workspace.dependencies]
calcvba-host-api = { path = "crates/calcvba-host-api" }
calcvba-office = { path = "crates/calcvba-office" }
calcvba-syntax = { path = "crates/calcvba-syntax" }
calcvba-diagnostics = { path = "crates/calcvba-diagnostics" }
calcvba-hal = { path = "crates/calcvba-hal" }
calcvba-runtime = { path = "crates/calcvba-runtime" }
calcvba-jit = { path = "crates/calcvba-jit" }
calcvba-pe = { path = "crates/calcvba-pe" }
calcvba-aot = { path = "crates/calcvba-aot" }
calcvba-com = { path = "crates/calcvba-com" }
calcvba-comhost = { path = "crates/calcvba-comhost" }
calcvba-engine = { path = "crates/calcvba-engine" }
calcvba-build = { path = "crates/calcvba-build" }
calcvba-project = { path = "crates/calcvba-project" }
calcvba-bundle = { path = "crates/calcvba-bundle" }
calcvba-lib = { path = "crates/calcvba-lib" }
calcvba-symbol = { path = "crates/calcvba-symbol" }
calcvba-bind = { path = "crates/calcvba-bind" }
calcvba-oxir = { path = "crates/calcvba-oxir" }
calcvba-rt-abi = { path = "crates/calcvba-rt-abi" }
calcvba-eval = { path = "crates/calcvba-eval" }
calcvba-vm3 = { path = "crates/calcvba-vm3" }
calcvba-differential = { path = "crates/calcvba-differential" }
rkyv = "0.8"
quick-xml = "0.37"
thiserror = "2"
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
cranelift-codegen = "0.133.1"
cranelift-frontend = "0.133.1"
cranelift-jit = "0.133.1"
cranelift-module = "0.133.1"
cranelift-native = "0.133.1"
