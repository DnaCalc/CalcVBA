[package]
name = "calcvba-build"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Clean OxVBA build target orchestration and wrapper artifact generation."

[dependencies]
calcvba-bind.workspace = true
calcvba-com.workspace = true
calcvba-diagnostics.workspace = true
calcvba-oxir.workspace = true
calcvba-aot.workspace = true
calcvba-jit.workspace = true
calcvba-pe.workspace = true
calcvba-rt-abi.workspace = true
calcvba-bundle.workspace = true
cranelift-codegen.workspace = true
cranelift-module.workspace = true
calcvba-project.workspace = true
calcvba-symbol.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
calcvba-engine.workspace = true
calcvba-hal.workspace = true
object = { version = "0.38", default-features = false, features = ["read", "pe", "std"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation", "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
