[package]
name = "calcvba-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
live-counters = ["calcvba-automation/live-counters"]

[dependencies]
calcvba-automation.workspace = true
codepage = "0.1.3"
encoding_rs = { version = "0.8.44", default-features = false, features = ["alloc"] }
thiserror.workspace = true
serde.workspace = true
rkyv.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }

[dev-dependencies]
proptest.workspace = true
calcvba-automation = { workspace = true, features = ["live-counters"] }
[lints]
workspace = true
